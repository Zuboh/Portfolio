<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .z-stroke { stroke: #F0EDE6; }
        .z-bg { fill: #0F0E0C; }
      }
      @media (prefers-color-scheme: light) {
        .z-stroke { stroke: #1A1916; }
        .z-bg { fill: #FAF9F6; }
      }
    </style>
  </defs>
  <rect class="z-bg" width="128" height="128"/>
  <g transform="translate(64, 64)">
    <!-- Z geometrica -->
    <g fill="none" class="z-stroke" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -24 -28 L 24 -28 L -24 28 L 24 28"/>
    </g>
    <!-- Dot accent -->
    <circle cx="28" cy="-24" r="6" fill="#5C9080"/>
  </g>
</svg>